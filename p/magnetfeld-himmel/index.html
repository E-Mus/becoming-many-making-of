<!DOCTYPE html>
<html lang="de">
<head><script src="/becoming-many-making-of/sw-register.js"></script><script src="/becoming-many-making-of/hub/inject.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnetfeldwahrnehmung — Experiment 1</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #c:active { cursor: grabbing; }

  #hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column;
         justify-content: space-between; align-items: center; padding: 14px 0 18px; }

  #compass { filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4)); }

  #bottom { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 720px; padding: 0 16px; }
  #modeInfo { text-align: center; color: #e8ecf5; background: rgba(10,12,20,0.55);
              backdrop-filter: blur(8px); border-radius: 12px; padding: 10px 18px; }
  #modeName { font-weight: 700; font-size: 15px; letter-spacing: 0.04em; }
  #modeDesc { font-size: 12.5px; opacity: 0.85; margin-top: 3px; line-height: 1.45; }

  #modes { display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; justify-content: center; }
  .lil-gui.root { max-height: calc(100vh - 16px); overflow-y: auto; }
  #modes button { border: 1px solid rgba(255,255,255,0.25); background: rgba(10,12,20,0.55);
                  color: #e8ecf5; border-radius: 10px; padding: 8px 14px; font-size: 13px;
                  cursor: pointer; backdrop-filter: blur(8px); transition: all 0.15s; }
  #modes button:hover { background: rgba(60,70,110,0.7); }
  #modes button.active { background: rgba(255,255,255,0.92); color: #10131f; font-weight: 700;
                         border-color: transparent; }

  #hint { position: fixed; top: 14px; left: 16px; color: rgba(232,236,245,0.75); font-size: 11.5px;
          text-align: left; line-height: 1.6; background: rgba(10,12,20,0.45); border-radius: 10px;
          padding: 8px 12px; backdrop-filter: blur(8px); }
  #backend { color: #8ef5c0; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <canvas id="compass"></canvas>
  <div id="bottom">
    <div id="modeInfo">
      <div id="modeName">…</div>
      <div id="modeDesc">Lade Renderer…</div>
    </div>
    <div id="modes">
      <button>1 Aurora</button>
      <button>2 Feldlinien</button>
      <button>3 Vogelblick</button>
      <button>4 Spektrum</button>
      <button>5 Eisenspäne</button>
      <button>6 Moiré</button>
      <button>7 Plasma</button>
      <button>8 Polarisation</button>
      <button>9 Vogelspektrum</button>
    </div>
  </div>
</div>

<div id="hint">
  Ziehen&nbsp;=&nbsp;Umschauen · WASD&nbsp;=&nbsp;Gehen · Shift&nbsp;=&nbsp;Rennen<br>
  Tasten 1–5 = Himmel wechseln · <span id="backend">…</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "/becoming-many-making-of/p/duftvolumen/vendor/three@0.180.0/build/three.webgpu.js",
    "three/webgpu": "/becoming-many-making-of/p/duftvolumen/vendor/three@0.180.0/build/three.webgpu.js",
    "three/tsl": "/becoming-many-making-of/p/duftvolumen/vendor/three@0.180.0/build/three.tsl.js",
    "three/addons/": "/becoming-many-making-of/p/magnetfeld-himmel/vendor/three@0.180.0/examples/jsm/"
  }
}
</script>
<script type="module" src="main.js"></script>
</body>
</html>
