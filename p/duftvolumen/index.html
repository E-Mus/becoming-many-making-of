<!DOCTYPE html>
<html lang="de">
<head><script src="/becoming-many-making-of/sw-register.js"></script><script src="/becoming-many-making-of/hub/inject.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmellVolume — volumetrische Geruchswolke (WebGPU / TSL)</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e7e7ee; }
    canvas { display: block; }

    #badge {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      font: 12px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #2a2a33; background: rgba(255,255,255,.75);
      border: 1px solid rgba(0,0,0,.08); border-radius: 8px;
      padding: 6px 10px; backdrop-filter: blur(6px);
      user-select: none; pointer-events: none;
    }
    #badge.webgl { color: #8a4b00; }
    #fps { opacity: .55; margin-left: 8px; }

    #warn {
      display: none;
      position: fixed; bottom: 12px; left: 12px; right: 12px; z-index: 10;
      max-width: 520px; margin: 0 auto;
      font: 12px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #6b3a00; background: rgba(255, 244, 224, .92);
      border: 1px solid rgba(180, 110, 0, .25); border-radius: 8px;
      padding: 8px 12px; text-align: center;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three":         "/becoming-many-making-of/p/duftvolumen/vendor/three@0.180.0/build/three.webgpu.js",
      "three/webgpu":  "/becoming-many-making-of/p/duftvolumen/vendor/three@0.180.0/build/three.webgpu.js",

      "lil-gui":       "/becoming-many-making-of/p/duftvolumen/vendor/lil-gui@0.19.2/dist/lil-gui.esm.js"
    }
  }
  </script>
</head>
<body>
  <div id="badge">Backend: …<span id="fps"></span></div>
  <div id="warn">
    <b>WebGL2-Fallback aktiv.</b> Die Volumen-Simulation ist in WebGL deutlich
    teurer — Grid-Aufl&ouml;sung und Raymarch-Steps wurden automatisch reduziert.
    F&uuml;r volle Qualit&auml;t einen Browser mit WebGPU verwenden (Chrome/Edge aktuell).
