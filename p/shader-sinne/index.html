<!DOCTYPE html>
<html lang="de">
<head><script src="/becoming-many-making-of/sw-register.js"></script><script src="/becoming-many-making-of/hub/inject.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sinnes-Sandbox — Shader-Ebenen für Becoming Many</title>
  <style>
    /* Basis-Styles; das Ebenen-Panel stylt sich selbst (src/ui/panel.css). */
    :root {
      --panel-bg: rgba(12, 14, 20, 0.85);
      --panel-border: rgba(255, 255, 255, 0.10);
      --text: #e8eaf0;
      --text-dim: #9aa0ae;
      --accent: #7fd4ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #ffffff; }
    body { font-family: "SF Mono", "Menlo", "Consolas", monospace; color: var(--text); }
    canvas { display: block; }

    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #ffffff; z-index: 100; font-size: 14px; color: #777;
      transition: opacity 0.5s; letter-spacing: 0.1em;
    }
    #loading.done { opacity: 0; pointer-events: none; }

    #controls-hint {
      position: fixed; bottom: 12px; left: 12px; z-index: 10;
      background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px;
      padding: 6px 10px; font-size: 10px; color: var(--text-dim);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    #controls-hint b { color: var(--text); }

    #webgpu-warn {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20;
      background: rgba(80, 40, 0, 0.9); border: 1px solid rgba(255, 180, 80, 0.5);
      border-radius: 8px; padding: 8px 14px; font-size: 11px; color: #ffd9a0;
      display: none; cursor: pointer;
    }
  </style>
  <script type="module" crossorigin src="/becoming-many-making-of/p/shader-sinne/assets/index-B1g0zsVh.js"></script>
  <link rel="stylesheet" crossorigin href="/becoming-many-making-of/p/shader-sinne/assets/index-DLSPxaSf.css">
</head>
<body>
  <div id="loading">Weiße Welt wird erzeugt …</div>
  <div id="controls-hint"><b>Maus ziehen</b> umsehen · <b>Scrollen</b> zoomen · <b>WASD</b> bewegen (Shift = schnell) — die Welt ist weiß, bis du dir rechts eigene Sinnes-Ebenen baust.</div>
  <div id="webgpu-warn" title="Klicken zum Ausblenden">⚠ Kein WebGPU verfügbar — läuft im WebGL2-Fallback (funktional identisch, ggf. langsamer).</div>
</body>
</html>
